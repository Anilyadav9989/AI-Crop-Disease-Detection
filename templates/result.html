<!DOCTYPE html>
<html>
<head>

<title>Prediction Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            🌱 Crop Disease Detection
        </a>

        <div>

            <a class="btn btn-light" href="/">
                Home
            </a>

            <a class="btn btn-warning" href="/dashboard">
                Dashboard
            </a>

            <a class="btn btn-info" href="/history">
                History
            </a>

            <a class="btn btn-primary" href="/assistant">
    AI Assistant
</a>

            <a class="btn btn-danger" href="/logout">
    Logout
</a>

        </div>

    </div>
</nav>

<div class="container mt-5">

<div class="card shadow p-4">

<h1 class="text-center text-primary">
Prediction Result
</h1>

<hr>

<div class="text-center">

    <h3>Uploaded Leaf Image</h3>

    <img
        src="{{ image_path }}"
        width="350"
        class="img-fluid rounded shadow">

</div>

<br>

<div class="card p-3 mb-3">

    <h3>Disease</h3>
    <p>{{ disease }}</p>

</div>

<div class="card p-3 mb-3">

    <h3>Confidence Score</h3>
    <p>{{ confidence }}%</p>

</div>

<div class="card p-3 mb-3">

    <h3>Recommended Fertilizer</h3>
    <p>{{ fertilizer }}</p>

</div>

<div class="card p-3 mb-3">

    <h3>Treatment Recommendation</h3>
    <p>{{ treatment }}</p>

</div>

<div class="text-center mt-4">

    <a href="/" class="btn btn-success">
        Check Another Leaf
    </a>

    <a href="/download-report"
       class="btn btn-danger">
        Download PDF Report
    </a>

</div>

</div>

</div>

</body>
</html>
